name: Cursor branch auto-merge (D)

# Aggressive path: push to cursor/** opens a ready PR (if needed) and
# squash-merges into the default branch without waiting for CI.
# Draft PRs are skipped. Conflicts / rate limits soft-fail (exit 0).
# Central hourly net: .github/workflows/auto-merge-cursor-prs.yml
#
# Push-only (no pull_request trigger) — avoids duplicate runs + GraphQL spam.

on:
  push:
    branches:
      - "cursor/**"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cursor-auto-merge-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  merge:
    if: startsWith(github.ref_name, 'cursor/')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve branch and ensure ready PR
        id: pr
        env:
          MIRROR_SYNC_TOKEN: ${{ secrets.MIRROR_SYNC_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export GH_TOKEN="${MIRROR_SYNC_TOKEN:-$GITHUB_TOKEN}"
          REPO="${{ github.repository }}"
          OWNER="${{ github.repository_owner }}"
          BRANCH="${{ github.ref_name }}"
          DEFAULT="$(gh api "repos/${REPO}" --jq '.default_branch')"

          # REST (avoid GraphQL quota used by `gh pr list --json`)
          ROW="$(gh api "repos/${REPO}/pulls?state=open&head=${OWNER}:${BRANCH}&per_page=1" \
            --jq '.[0] | if . == null then empty else "\(.number)\t\(.draft)\t\(.title)" end' 2>/dev/null || true)"

          if [[ -z "$ROW" ]]; then
            TITLE="chore(auto-merge): ${BRANCH}"
            # REST create PR
            if ! NUM="$(gh api -X POST "repos/${REPO}/pulls" \
              -f title="$TITLE" \
              -f head="$BRANCH" \
              -f base="$DEFAULT" \
              -f body="Auto-opened by cursor-branch-auto-merge.yml (C+D). Squash-merge without waiting for CI." \
              --jq '.number' 2>/dev/null)"; then
              echo "PR create blocked (token or rate limit). Central hourly auto-merge will retry."
              echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
              echo "number=" >> "$GITHUB_OUTPUT"
              echo "draft=true" >> "$GITHUB_OUTPUT"
              echo "title=${TITLE}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            DRAFT="false"
          else
            NUM="$(printf '%s' "$ROW" | cut -f1)"
            DRAFT="$(printf '%s' "$ROW" | cut -f2)"
            TITLE="$(printf '%s' "$ROW" | cut -f3-)"
          fi

          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "number=${NUM}" >> "$GITHUB_OUTPUT"
          echo "draft=${DRAFT}" >> "$GITHUB_OUTPUT"
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"
          echo "default=${DEFAULT}" >> "$GITHUB_OUTPUT"

      - name: Squash-merge without CI wait
        if: steps.pr.outputs.draft != 'true' && steps.pr.outputs.number != ''
        env:
          MIRROR_SYNC_TOKEN: ${{ secrets.MIRROR_SYNC_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          export GH_TOKEN="${MIRROR_SYNC_TOKEN:-$GITHUB_TOKEN}"
          REPO="${{ github.repository }}"
          NUM="${{ steps.pr.outputs.number }}"
          TITLE="${{ steps.pr.outputs.title }}"
          LOWER="$(printf '%s' "$TITLE" | tr '[:upper:]' '[:lower:]')"
          case "$LOWER" in
            *wip*|*do\ not\ merge*|*don\'t\ merge*|*dont\ merge*|*no\ merge*)
              echo "Skip blocked title: $TITLE"
              exit 0
              ;;
          esac

          # REST mergeable flag (true/false/null) — avoid GraphQL `gh pr view`
          MERGEABLE="$(gh api "repos/${REPO}/pulls/${NUM}" --jq '.mergeable' 2>/dev/null)"
          if [[ "$MERGEABLE" == "false" ]]; then
            echo "Skip non-mergeable PR #$NUM (conflict or unknown)"
            exit 0
          fi

          if gh api -X PUT "repos/${REPO}/pulls/${NUM}/merge" \
            -f merge_method=squash \
            -f commit_title="$TITLE" \
            -F delete_branch=true >/dev/null 2>&1; then
            echo "Merged #$NUM via REST"
            exit 0
          fi

          # Fallback: gh CLI (may use GraphQL)
          if gh pr merge "$NUM" --repo "$REPO" --squash --delete-branch --admin 2>/dev/null; then
            echo "Merged #$NUM with --admin"
            exit 0
          fi
          if gh pr merge "$NUM" --repo "$REPO" --squash --delete-branch 2>/dev/null; then
            echo "Merged #$NUM"
            exit 0
          fi
          echo "Could not merge #$NUM (permissions, conflict, or rate limit). Central hourly job may retry."
          exit 0
