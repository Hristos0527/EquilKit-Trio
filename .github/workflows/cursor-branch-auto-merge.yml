name: Cursor branch auto-merge (D)

# Aggressive path: any push to cursor/** opens a ready PR (if needed) and
# squash-merges into the default branch without waiting for CI.
# Draft PRs are skipped. Conflicts are skipped.
# Central hourly net: .github/workflows/auto-merge-cursor-prs.yml

on:
  push:
    branches:
      - "cursor/**"
  pull_request:
    types: [opened, ready_for_review, synchronize, reopened]
    branches: [master, main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cursor-auto-merge-${{ github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  merge:
    if: >
      (github.event_name == 'push' && startsWith(github.ref_name, 'cursor/')) ||
      (github.event_name == 'pull_request' &&
       startsWith(github.head_ref, 'cursor/') &&
       github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - name: Resolve branch and ensure ready PR
        id: pr
        env:
          # Prefer PAT so Actions can open PRs (GITHUB_TOKEN is often blocked).
          GH_TOKEN: ${{ secrets.MIRROR_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DEFAULT="$(gh api "repos/${{ github.repository }}" --jq '.default_branch')"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BRANCH="${{ github.head_ref }}"
            NUM="${{ github.event.pull_request.number }}"
            DRAFT="${{ github.event.pull_request.draft }}"
            TITLE="${{ github.event.pull_request.title }}"
          else
            BRANCH="${{ github.ref_name }}"
            ROW="$(gh pr list --repo "${{ github.repository }}" --head "$BRANCH" --state open \
              --json number,isDraft,title --jq '.[0] | "\(.number)\t\(.isDraft)\t\(.title)"' || true)"
            if [[ -z "$ROW" || "$ROW" == "null"* ]]; then
              TITLE="chore(auto-merge): ${BRANCH}"
              if ! gh pr create --repo "${{ github.repository }}" --base "$DEFAULT" --head "$BRANCH" \
                --title "$TITLE" \
                --body "Auto-opened by cursor-branch-auto-merge.yml (C+D). Squash-merge without waiting for CI."; then
                echo "PR create blocked (token permissions). Central hourly auto-merge will retry."
                echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
                echo "number=" >> "$GITHUB_OUTPUT"
                echo "draft=true" >> "$GITHUB_OUTPUT"
                echo "title=${TITLE}" >> "$GITHUB_OUTPUT"
                echo "default=${DEFAULT}" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              ROW="$(gh pr list --repo "${{ github.repository }}" --head "$BRANCH" --state open \
                --json number,isDraft,title --jq '.[0] | "\(.number)\t\(.isDraft)\t\(.title)"')"
            fi
            NUM="$(printf '%s' "$ROW" | cut -f1)"
            DRAFT="$(printf '%s' "$ROW" | cut -f2)"
            TITLE="$(printf '%s' "$ROW" | cut -f3-)"
          fi

          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "number=${NUM}" >> "$GITHUB_OUTPUT"
          echo "draft=${DRAFT}" >> "$GITHUB_OUTPUT"
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"
          echo "default=${DEFAULT}" >> "$GITHUB_OUTPUT"

      - name: Squash-merge without CI wait
        if: steps.pr.outputs.draft != 'true' && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.MIRROR_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NUM="${{ steps.pr.outputs.number }}"
          TITLE="${{ steps.pr.outputs.title }}"
          LOWER="$(printf '%s' "$TITLE" | tr '[:upper:]' '[:lower:]')"
          case "$LOWER" in
            *wip*|*do\ not\ merge*|*don\'t\ merge*|*dont\ merge*|*no\ merge*)
              echo "Skip blocked title: $TITLE"
              exit 0
              ;;
          esac

          MERGEABLE="$(gh pr view "$NUM" --repo "${{ github.repository }}" --json mergeable --jq '.mergeable')"
          if [[ "$MERGEABLE" == "CONFLICTING" ]]; then
            echo "Skip conflicting PR #$NUM"
            exit 0
          fi

          if gh pr merge "$NUM" --repo "${{ github.repository }}" --squash --delete-branch --admin; then
            echo "Merged #$NUM with --admin"
            exit 0
          fi
          if gh pr merge "$NUM" --repo "${{ github.repository }}" --squash --delete-branch; then
            echo "Merged #$NUM"
            exit 0
          fi
          echo "Could not merge #$NUM (permissions or other block). Central hourly job may retry."
          exit 0
