name: Agent continuity hygiene

on:
  schedule:
    # Monday 06:00 UTC — weekly orphan-branch report
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [master, main]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  continuity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq

      - name: Fetch default branch
        run: |
          git fetch origin master main 2>/dev/null || true

      - name: Run continuity check
        id: check
        run: |
          chmod +x scripts/agent-continuity-check.sh
          set +e
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            ./scripts/agent-continuity-check.sh 2>&1 | tee continuity.log
          else
            ./scripts/agent-continuity-check.sh --strict 2>&1 | tee continuity.log
          fi
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Comment on PR with continuity report
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('continuity.log', 'utf8');
            const text = `## Agent continuity report\n\nReview unmerged \`cursor/*\` branches before closing this PR. Merge or port orphaned work to avoid lost features.\n\n\`\`\`\n${body.slice(0, 6000)}\n\`\`\`\n\nSee [docs/AGENT_CONTINUITY.md](https://github.com/${{ github.repository }}/blob/master/docs/AGENT_CONTINUITY.md).`;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: text,
            });

      - name: Open or update weekly hygiene issue
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('continuity.log', 'utf8');
            const title = 'chore: agent continuity hygiene report';
            const body = `Auto-generated by \`agent-continuity.yml\`.\n\n\`\`\`\n${log.slice(0, 12000)}\n\`\`\`\n\n**Action:** merge or port unmerged \`cursor/*\` branches; close superseded PRs.\n\nDocs: [AGENT_CONTINUITY.md](https://github.com/${{ github.repository }}/blob/master/docs/AGENT_CONTINUITY.md)`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'agent-hygiene',
              per_page: 5,
            });
            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body: `## Update ${new Date().toISOString().slice(0, 10)}\n\n\`\`\`\n${log.slice(0, 8000)}\n\`\`\``,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['agent-hygiene'],
              });
            }
